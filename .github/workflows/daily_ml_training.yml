name: Daily ML Spot Forecast Training & Data Accumulation

on:
  schedule:
    # Ajetaan kahdesti vuorokaudessa Suomen aikaa:
    # 1) klo 13:45 (11:45 UTC): kun uudet vahvistetut Nord Pool -hinnat julkaistaan ja malli tarkentaa aiempia ennusteitaan
    # 2) klo 01:45 (23:45 UTC): yöllä vuorokauden vaihduttua ja tuoreen yö-säämalliajon valmistuttua (uusi tuleva päivä + tarkennus)
    - cron: '50 11,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch new Nord Pool & weather observations and retrain ML model
        run: |
          python train_and_learn.py
          python train_nordpool_countries.py
          python seo_generator.py
          python build_nordpool_sites.py

      - name: Commit accumulated observations and updated ML weights
        run: |
          git config user.name "Sahkomittari ML Bot"
          git config user.email "bot@sahkomittari.fi"
          git add data/historical_observations.json data/error_learning_ledger.json data/nordpool_models.json ml_weights.json ml_weights.js nordpool_models.js
          git diff --staged --quiet || git commit -m "Auto-learn: accumulate new spot/weather observations and retrain ML forecast weights"
          git push
