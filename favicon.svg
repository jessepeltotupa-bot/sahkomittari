<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Industrial meter dark housing -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#111210" stroke="#ffd000" stroke-width="3.5"/>
  <!-- Top meter status strip -->
  <rect x="9" y="9" width="46" height="6.5" rx="2" fill="#232622"/>
  <circle cx="13.5" cy="12.25" r="2" fill="#00d455"/>
  <rect x="19" y="11" width="18" height="2.5" rx="1.2" fill="#f5f3ec" opacity="0.75"/>
  <!-- 3 signature spot-chart bars (Cheap green, Normal blue, High orange-red) -->
  <rect x="10" y="38" width="11.5" height="16" rx="2" fill="#009e3d"/>
  <rect x="26.25" y="27" width="11.5" height="27" rx="2" fill="#0038ff"/>
  <rect x="42.5" y="19" width="11.5" height="35" rx="2" fill="#ff3b00"/>
  <!-- High-contrast Signal Yellow Lightning Bolt with rounded dark halo -->
  <polygon points="36,12 18,35 30.5,35 25,54 46,29 33.5,29" fill="none" stroke="#111210" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="36,12 18,35 30.5,35 25,54 46,29 33.5,29" fill="#ffd000"/>
</svg>
